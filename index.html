<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>বাজারঘর – অনলাইন শপ</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#14231c;--mute:#5d6d65;--line:#dfe7e2;--brand:#0b6b4d;--brand2:#084f39;--accent:#f2a900;--sale:#d6362b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1612;--card:#17231d;--ink:#e8f1ec;--mute:#9bb0a5;--line:#263830;--brand:#2fb88a;--brand2:#1e8c68}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:'Hind Siliguri',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:#fff;display:flex;gap:10px;align-items:center;padding:10px 14px}
.logo{font-weight:700;font-size:20px;white-space:nowrap}
.search{flex:1;min-width:0;border:0;border-radius:8px;padding:10px 12px;font:inherit;background:#fff;color:#14231c}
.cartbtn{background:var(--accent);color:#14231c;border:0;border-radius:8px;padding:9px 12px;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
.hero{margin:14px;padding:22px;border-radius:14px;background:var(--brand2);color:#fff}
.hero h1{margin:0 0 6px;font-size:24px}.hero p{margin:0;opacity:.9}
.cats{display:flex;gap:8px;overflow-x:auto;padding:0 14px 6px}
.cat{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 14px;font:inherit;cursor:pointer}
.cat.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:12px 14px 30px;max-width:1100px;margin:auto}
.p{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.pic{font-size:54px;text-align:center;padding:18px 0;background:var(--bg);position:relative}
.off{position:absolute;top:8px;left:8px;background:var(--sale);color:#fff;font-size:12px;padding:2px 7px;border-radius:5px}
.pi{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.pn{font-weight:500;line-height:1.3}.pr{font-weight:700;color:var(--brand);font-size:18px}
.old{text-decoration:line-through;color:var(--mute);font-size:13px;margin-left:6px;font-weight:400}
.rt{color:var(--mute);font-size:13px}
.add{margin-top:auto;border:0;background:var(--brand);color:#fff;border-radius:7px;padding:8px;font:inherit;font-weight:500;cursor:pointer}
.add:focus-visible,.cat:focus-visible,.cartbtn:focus-visible,.search:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.empty{padding:40px 14px;text-align:center;color:var(--mute)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);background:var(--card);z-index:20;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:-6px 0 24px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px solid var(--line);font-weight:700}
.dh button{border:0;background:none;color:var(--ink);font-size:24px;cursor:pointer}
.items{flex:1;overflow:auto;padding:8px 14px}
.it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.it .e{font-size:30px}.it .m{flex:1}.q{display:flex;gap:6px;align-items:center}
.q button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.df{padding:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:18px}
.df input{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:7px;padding:9px;font:inherit}
.ok{background:var(--accent);color:#14231c;border:0;border-radius:8px;padding:11px;font:inherit;font-weight:700;cursor:pointer}
.msg{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30;display:none}
footer{text-align:center;color:var(--mute);padding:20px;font-size:13px}
</style>
</head>
<body>
<header>
  <div class="logo">🛒 বাজারঘর</div>
  <input id="q" class="search" type="search" placeholder="পণ্য খুঁজুন…" aria-label="পণ্য খুঁজুন">
  <button class="cartbtn" id="openCart">কার্ট (<span id="cc">0</span>)</button>
</header>
<section class="hero"><h1>সারা দেশে ক্যাশ অন ডেলিভারি</h1><p>পছন্দের পণ্য বেছে নিন, ঘরে বসেই পেয়ে যান।</p></section>
<nav class="cats" id="cats" aria-label="ক্যাটাগরি"></nav>
<main class="grid" id="grid"></main>
<footer>© বাজারঘর</footer>

<aside class="drawer" id="drawer" aria-label="কার্ট">
  <div class="dh"><span>আপনার কার্ট</span><button id="closeCart" aria-label="বন্ধ করুন">×</button></div>
  <div class="items" id="items"></div>
  <div class="df">
    <div class="tot"><span>মোট</span><span id="total">৳০</span></div>
    <input id="nm" placeholder="আপনার নাম">
    <input id="ph" type="tel" placeholder="মোবাইল নম্বর">
    <input id="ad" placeholder="ডেলিভারি ঠিকানা">
    <button class="ok" id="order">হোয়াটসঅ্যাপে অর্ডার করুন</button>
  </div>
</aside>
<div class="msg" id="msg"></div>

<script>
var WA='8801913400104'; // এখানে আপনার হোয়াটসঅ্যাপ নম্বর বসান (৮৮০ দিয়ে, যেমন 8801712345678)
var P=[
{n:'ওয়্যারলেস হেডফোন',c:'ইলেকট্রনিক্স',e:'🎧',p:1850,o:2500,r:4.5},
{n:'স্মার্ট ওয়াচ',c:'ইলেকট্রনিক্স',e:'⌚',p:2990,o:3999,r:4.3},
{n:'পাওয়ার ব্যাংক ১০০০০mAh',c:'ইলেকট্রনিক্স',e:'🔋',p:1190,o:1500,r:4.6},
{n:'ব্লুটুথ স্পিকার',c:'ইলেকট্রনিক্স',e:'🔊',p:1450,o:1900,r:4.2},
{n:'ছেলেদের পাঞ্জাবি',c:'ফ্যাশন',e:'👘',p:1290,o:1790,r:4.4},
{n:'স্নিকার্স জুতা',c:'ফ্যাশন',e:'👟',p:1990,o:2600,r:4.5},
{n:'ব্যাকপ্যাক',c:'ফ্যাশন',e:'🎒',p:950,o:1300,r:4.3},
{n:'সানগ্লাস',c:'ফ্যাশন',e:'🕶️',p:490,o:790,r:4.0},
{n:'নন-স্টিক ফ্রাইপ্যান',c:'ঘর-গৃহস্থালি',e:'🍳',p:790,o:1100,r:4.4},
{n:'ইলেকট্রিক কেটলি',c:'ঘর-গৃহস্থালি',e:'☕',p:1150,o:1500,r:4.5},
{n:'টেবিল ল্যাম্প',c:'ঘর-গৃহস্থালি',e:'💡',p:560,o:800,r:4.1},
{n:'বাচ্চাদের খেলনা সেট',c:'শিশু ও খেলনা',e:'🧸',p:690,o:950,r:4.7},
{n:'বাচ্চাদের ছবির বই',c:'শিশু ও খেলনা',e:'📚',p:320,o:450,r:4.6},
{n:'ফেসওয়াশ',c:'সৌন্দর্য',e:'🧴',p:380,o:520,r:4.3},
{n:'পারফিউম',c:'সৌন্দর্য',e:'🌸',p:1250,o:1700,r:4.4},
{n:'ক্রিকেট ব্যাট',c:'খেলাধুলা',e:'🏏',p:2200,o:2800,r:4.5}
];
var cart={},cat='সব',term='';
function bn(n){return String(n).replace(/\d/g,function(d){return '০১২৩৪৫৬৭৮৯'[d]})}
function tk(n){return '৳'+bn(n.toLocaleString('en-US'))}
function $(i){return document.getElementById(i)}
function drawCats(){
  var cs=['সব'];P.forEach(function(p){if(cs.indexOf(p.c)<0)cs.push(p.c)});
  $('cats').innerHTML=cs.map(function(c){return '<button class="cat'+(c===cat?' on':'')+'" data-c="'+c+'">'+c+'</button>'}).join('');
}
function drawGrid(){
  var l=P.map(function(p,i){return{p:p,i:i}}).filter(function(x){
    return (cat==='সব'||x.p.c===cat)&&x.p.n.indexOf(term)>-1});
  $('grid').innerHTML=l.length?l.map(function(x){var p=x.p,d=Math.round((1-p.p/p.o)*100);
    return '<div class="p"><div class="pic">'+p.e+'<span class="off">-'+bn(d)+'%</span></div><div class="pi"><div class="pn">'+p.n+'</div><div class="rt">★ '+bn(p.r)+'</div><div class="pr">'+tk(p.p)+'<span class="old">'+tk(p.o)+'</span></div><button class="add" data-i="'+x.i+'">কার্টে যোগ করুন</button></div></div>'}).join(''):'<div class="empty" style="grid-column:1/-1">কোনো পণ্য পাওয়া যায়নি। অন্য নাম দিয়ে খুঁজুন।</div>';
}
function drawCart(){
  var ks=Object.keys(cart),t=0,c=0;
  $('items').innerHTML=ks.length?ks.map(function(k){var p=P[k],q=cart[k];t+=p.p*q;c+=q;
    return '<div class="it"><div class="e">'+p.e+'</div><div class="m"><div>'+p.n+'</div><b>'+tk(p.p*q)+'</b></div><div class="q"><button data-m="'+k+'">−</button><span>'+bn(q)+'</span><button data-a="'+k+'">+</button></div></div>'}).join(''):'<div class="empty">কার্ট খালি। পছন্দের পণ্য যোগ করুন।</div>';
  $('total').textContent=tk(t);$('cc').textContent=bn(c);
}
function toast(s){var m=$('msg');m.textContent=s;m.style.display='block';setTimeout(function(){m.style.display='none'},2200)}
$('cats').onclick=function(e){var c=e.target.getAttribute('data-c');if(c){cat=c;drawCats();drawGrid()}};
$('q').oninput=function(e){term=e.target.value.trim();drawGrid()};
$('grid').onclick=function(e){var i=e.target.getAttribute('data-i');if(i!==null){cart[i]=(cart[i]||0)+1;drawCart();toast('কার্টে যোগ হয়েছে')}};
$('items').onclick=function(e){var a=e.target.getAttribute('data-a'),m=e.target.getAttribute('data-m');
  if(a!==null)cart[a]++;if(m!==null){cart[m]--;if(cart[m]<1)delete cart[m]}drawCart()};
$('openCart').onclick=function(){$('drawer').classList.add('open')};
$('closeCart').onclick=function(){$('drawer').classList.remove('open')};
$('order').onclick=function(){
  if(!Object.keys(cart).length){toast('আগে কার্টে পণ্য যোগ করুন');return}
  if(!$('nm').value||!$('ph').value||!$('ad').value){toast('নাম, মোবাইল ও ঠিকানা দিন');return}
  var lines=Object.keys(cart).map(function(k){return '• '+P[k].n+' × '+bn(cart[k])+' = '+tk(P[k].p*cart[k])}),t=0;
  Object.keys(cart).forEach(function(k){t+=P[k].p*cart[k]});
  var text='নতুন অর্ডার\n'+lines.join('\n')+'\nমোট: '+tk(t)+'\nনাম: '+$('nm').value+'\nমোবাইল: '+$('ph').value+'\nঠিকানা: '+$('ad').value+'\n(ক্যাশ অন ডেলিভারি)';
  window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(text),'_blank');
  cart={};drawCart();$('drawer').classList.remove('open');toast('হোয়াটসঅ্যাপে মেসেজ পাঠিয়ে অর্ডার শেষ করুন');
};
drawCats();drawGrid();drawCart();
</script>
</body>
</html>
